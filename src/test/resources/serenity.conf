serenity {
  project.name = "Reto SwagLabs - Screenplay Mobile"
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
}

webdriver {
  driver = appium
  timeouts {
    implicitlywait = 5000
  }
}

# Appium 2/3 usa el protocolo W3C: las capacidades propias de Appium deben llevar el prefijo "appium:".
appium.process.desired.capabilities = true
appium.additional.capabilities = "automationName,deviceName,appPackage,appActivity,appWaitActivity,noReset,fullReset,newCommandTimeout,autoGrantPermissions"

appium {
  hub = "http://127.0.0.1:4723"
  platformName = "Android"
  automationName = "UiAutomator2"
  deviceName = "emulator-5554"
  # La app se instala antes con: adb install -r apps/swaglabs.apk  (lo hace ejecutar-prueba.command)
  appPackage = "com.swaglabsmobileapp"
  appActivity = "com.swaglabsmobileapp.MainActivity"
  appWaitActivity = "com.swaglabsmobileapp.*"
  noReset = false
  fullReset = false
  autoGrantPermissions = true
  newCommandTimeout = 120
}

serenity.restart.browser.for.each = scenario
