plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.2.1'
}

group = 'co.com.choucair'
version = '1.0.0'

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '4.2.1'
    cucumberVersion = '7.18.0'
    junitPlatformVersion = '1.10.2'
    junitJupiterVersion = '5.10.2'
}

dependencies {
    testImplementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-ensure:${serenityVersion}"

    testImplementation "io.appium:java-client:9.3.0"

    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    testImplementation "org.junit.platform:junit-platform-suite:${junitPlatformVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}"

    testImplementation "junit:junit:4.13.2" // requerido por SerenityReporterParallel
    testImplementation "org.hamcrest:hamcrest:2.2"
    testImplementation "org.slf4j:slf4j-simple:2.0.13"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperties System.getProperties()
    testLogging.showStandardStreams = true
    finalizedBy 'aggregate'
}
